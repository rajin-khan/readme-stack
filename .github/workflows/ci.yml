name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check generated files
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Verify the Worker bundle
        env:
          WRANGLER_LOG_PATH: /tmp/readme-stack-wrangler.log
        run: pnpm exec wrangler deploy --dry-run
