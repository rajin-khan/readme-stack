<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>README Stack social image</title>
    <style>
      @font-face {
        font-family: "Satoshi";
        src: url("../fonts/satoshi-400.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Satoshi";
        src: url("../fonts/satoshi-700.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "La Belle Aurore";
        src: url("../fonts/la-belle-aurore.woff2") format("woff2");
        font-weight: 400;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0a0a0a;
      }
      body {
        position: relative;
        color: #f5f5f4;
        font-family: "Satoshi", sans-serif;
      }
      body::before {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, transparent 79px, #232323 80px, transparent 81px),
          linear-gradient(90deg, transparent 1119px, #232323 1120px, transparent 1121px),
          linear-gradient(transparent 71px, #232323 72px, transparent 73px),
          linear-gradient(transparent 557px, #232323 558px, transparent 559px);
        content: "";
      }
      .corner {
        position: absolute;
        top: 30px;
        color: #8c8c8c;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .corner.left { left: 80px; }
      .corner.right { right: 80px; }
      main {
        position: relative;
        display: flex;
        height: 100%;
        flex-direction: column;
        justify-content: center;
        padding: 82px 80px 88px;
      }
      h1 {
        display: flex;
        align-items: baseline;
        gap: 28px;
        margin: 2px 0 18px;
        font-size: 108px;
        font-weight: 700;
        letter-spacing: -0.07em;
        line-height: 0.9;
      }
      h1 em {
        font-family: "La Belle Aurore", cursive;
        font-size: 99px;
        font-style: normal;
        font-weight: 400;
        letter-spacing: 0;
        transform: rotate(-2deg);
      }
      .lede {
        width: 690px;
        margin: 0;
        color: #a3a3a3;
        font-size: 28px;
        line-height: 1.35;
      }
      .stack {
        display: flex;
        height: 120px;
        align-items: center;
        gap: 12px;
        margin-top: 58px;
        overflow: hidden;
        border: 1px solid #303030;
        border-radius: 12px;
        background: #111111;
        padding: 18px;
      }
      .tool {
        display: flex;
        min-width: max-content;
        align-items: center;
        gap: 11px;
        border-right: 1px solid #303030;
        padding: 0 22px 0 4px;
        font-size: 19px;
        font-weight: 700;
      }
      .mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .ts { background: #3178c6; }
      .react { background: #20232a; color: #61dafb; border: 1px solid #38414a; }
      .next { background: #f5f5f4; color: #111; }
      .tailwind { background: #0f172a; color: #38bdf8; }
      .cloudflare { background: #f38020; }
      .github { background: #f5f5f4; color: #111; }
      .dot {
        position: absolute;
        right: 80px;
        top: 91px;
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #ef765a;
        box-shadow: 0 0 0 7px rgb(239 118 90 / 0.12);
      }
      .url {
        position: absolute;
        right: 80px;
        bottom: 32px;
        color: #8c8c8c;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <span class="corner left">GitHub profile tool</span>
    <span class="corner right">345 tools · SVG</span>
    <span class="dot"></span>
    <main>
      <h1><span>README</span><em>Stack</em></h1>
      <p class="lede">Build an animated tech stack for your GitHub profile.</p>
      <div class="stack" aria-label="Example developer Tool Stack">
        <div class="tool"><span class="mark ts">TS</span>TypeScript</div>
        <div class="tool"><span class="mark react">⚛</span>React</div>
        <div class="tool"><span class="mark next">N</span>Next.js</div>
        <div class="tool"><span class="mark tailwind">TW</span>Tailwind</div>
        <div class="tool"><span class="mark cloudflare">CF</span>Cloudflare</div>
        <div class="tool"><span class="mark github">GH</span>GitHub</div>
      </div>
    </main>
    <span class="url">stack.rajinkhan.com</span>
  </body>
</html>
