<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>README Stack social image</title>
    <style>
      @font-face {
        font-family: "Satoshi";
        src: url("../fonts/satoshi-400.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Satoshi";
        src: url("../fonts/satoshi-700.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "La Belle Aurore";
        src: url("../fonts/la-belle-aurore.woff2") format("woff2");
        font-weight: 400;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0a0a0a;
      }
      body {
        display: grid;
        place-items: center;
        color: #f5f5f4;
        font-family: "Satoshi", sans-serif;
      }
      main {
        display: flex;
        width: 1040px;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      h1 {
        display: flex;
        align-items: baseline;
        gap: 28px;
        margin: 0 0 20px;
        font-size: 112px;
        font-weight: 700;
        letter-spacing: -0.07em;
        line-height: 0.9;
      }
      h1 em {
        font-family: "La Belle Aurore", cursive;
        font-size: 101px;
        font-style: normal;
        font-weight: 400;
        letter-spacing: 0;
        transform: rotate(-2deg);
      }
      .lede {
        margin: 0;
        color: #a3a3a3;
        font-size: 28px;
        line-height: 1.35;
      }
      .stack {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        margin-top: 68px;
      }
      .tool {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #d4d4d4;
        font-size: 18px;
        font-weight: 700;
        white-space: nowrap;
      }
      .logo {
        display: block;
        width: 43px;
        height: 43px;
      }
      .logo path { fill: var(--brand); }
      .next path, .github path { fill: #f5f5f4; }
      .url {
        margin-top: 62px;
        color: #737373;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
